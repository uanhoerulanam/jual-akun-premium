<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05030d">
<title>UAN Digital Store</title>
<link rel="icon" href="logo.jpg">

<style>
:root {
  --bg: #05030d;
  --blue: #2f6bff;
  --purple: #b43cff;
  --silver: #f2f4ff;
  --muted: #b4b2d0;
  --grad: linear-gradient(90deg, var(--blue), var(--purple));
  --k: 0;
  --n: 6;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body { height: 100%; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color: var(--silver);
  background: var(--bg);
  overflow: hidden;
}

.bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 0% 0%, rgba(47,107,255,.34), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(180,60,255,.32), transparent 50%),
    var(--bg);
}

/* Kaca air bening putih */
.glass {
  background: linear-gradient(160deg, rgba(255,255,255,.26), rgba(255,255,255,.07) 40%, rgba(255,255,255,.12));
  border: 1px solid rgba(255,255,255,.38);
  box-shadow:
    0 8px 24px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.15),
    inset 0 0 18px rgba(255,255,255,.07);
}
.blur {
  -webkit-backdrop-filter: blur(10px) saturate(150%);
  backdrop-filter: blur(10px) saturate(150%);
}

.grad-text {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* Header */
.top {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 460px;
  z-index: 20;
  padding: 8px 10px 8px 12px;
  border-radius: 20px;
  display: flex; align-items: center; gap: 9px;
}
.top img {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  box-shadow: 0 0 12px rgba(47,107,255,.6), 0 0 12px rgba(180,60,255,.5);
}
.top .ttl { min-width: 0; }
.top .ttl b {
  display: block;
  font-size: 13px;
  line-height: 1.15;
}

/* Badge diskon api */
.promo {
  position: relative;
  margin-left: auto;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px 4px 4px;
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(135deg, #ff1f1f, #ff6a00);
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 0 12px rgba(255,40,20,.6), inset 0 1px 0 rgba(255,255,255,.5);
}
.promo::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 999px;
  box-shadow: 0 0 16px 3px rgba(255,60,20,.9);
  opacity: .3;
  pointer-events: none;
  animation: glowp 1.1s ease-in-out infinite alternate;
}
@keyframes glowp { to { opacity: .9; } }

.promo .fire {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, #ff5a3c, #a80000);
  box-shadow: 0 0 10px rgba(255,80,40,.9), inset 0 1px 0 rgba(255,255,255,.4);
}
.promo .fire span {
  display: block;
  font-size: 15px;
  line-height: 1;
  animation: flame .55s ease-in-out infinite;
}
@keyframes flame {
  0%, 100% { transform: scale(1) rotate(-5deg); }
  50%      { transform: scale(1.2) rotate(6deg); }
}
.promo small {
  display: block;
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: .6px;
  line-height: 1;
  color: #fff;
}
.promo b {
  display: block;
  font-size: 12px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: .2px;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,.35);
}

.snd {
  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.38);
  background: rgba(255,255,255,.12);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}

/* Pager geser */
.pager {
  position: fixed; inset: 0;
  display: flex;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.pager::-webkit-scrollbar { display: none; }

.slide {
  flex: 0 0 100%;
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: calc(74px + env(safe-area-inset-top, 0px)) 14px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center;
}
.slide > .in { width: 100%; max-width: 460px; margin: auto; }

/* Poster utuh, tidak terpotong */
.poster-box { display: flex; justify-content: center; margin-bottom: 12px; }
.poster {
  position: relative;
  display: block;
  padding: 0; border: 0;
  border-radius: 20px;
  overflow: hidden;
  cursor: zoom-in;
  background: #000;
  box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.3), 0 0 26px rgba(255,255,255,.12);
}
.poster img {
  display: block;
  max-width: 100%;
  max-height: max(200px, calc(100dvh - 415px));
  width: auto; height: auto;
}
.badge {
  position: absolute; top: 10px; left: 10px;
  padding: 5px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 700; color: #1a1440;
  background: rgba(255,255,255,.88);
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
}

/* Panel beli */
.panel { border-radius: 20px; padding: 14px 16px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.row > div:first-child { min-width: 0; }
.row h3 { font-size: 16px; line-height: 1.25; }
.row small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Kotak harga: DARI & JADI */
.prices {
  flex-shrink: 0;
  display: grid;
  gap: 5px;
  padding: 8px 10px;
  border-radius: 14px;
  background: linear-gradient(160deg, rgba(0,0,0,.28), rgba(0,0,0,.12));
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.pr {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.lbl {
  display: inline-block;
  min-width: 42px;
  padding: 3px 0;
  border-radius: 999px;
  text-align: center;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .8px;
  line-height: 1.2;
}
.lbl.dari {
  color: #ffb3c1;
  background: rgba(255,77,109,.16);
  border: 1px solid rgba(255,77,109,.4);
}
.lbl.jadi {
  color: #fff;
  background: linear-gradient(135deg, #ff3d3d, #ff9100);
  box-shadow: 0 2px 10px rgba(255,90,30,.55), inset 0 1px 0 rgba(255,255,255,.4);
}
.old {
  font-size: 13px;
  font-weight: 600;
  color: #a8a4c4;
  text-decoration: line-through;
  text-decoration-color: #ff4d6d;
  text-decoration-thickness: 2px;
}
.price {
  font-size: 26px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: .2px;
  background: linear-gradient(180deg, #ffffff 20%, #ffe29a 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 10px rgba(255,200,100,.45));
}

/* Teks download aplikasi */
.dl {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
  font-size: 11.5px;
  color: var(--muted);
}
.store {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.28);
}

/* Tombol bukti testimoni */
.proof {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%;
  margin-bottom: 10px;
  padding: 9px 10px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.proof b { color: #ffe29a; font-weight: 800; }

.buy, .btn {
  display: block; width: 100%;
  padding: 13px;
  border: 0; border-radius: 14px;
  font-size: 14px; font-weight: 700;
  text-align: center; text-decoration: none;
  cursor: pointer;
  color: #1a1440;
  background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(214,228,255,.88));
  box-shadow: 0 6px 18px rgba(255,255,255,.18), inset 0 1px 0 #fff, inset 0 -2px 6px rgba(120,150,255,.25);
}
/* Tombol hijau Saluran WhatsApp */
.btn.wa {
  color: #fff;
  background: linear-gradient(135deg, #25d366, #128c7e);
  box-shadow: 0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.45);
}

/* Efek sentuh air */
.fx { position: relative; overflow: hidden; transition: transform .15s; }
.fx > * { position: relative; z-index: 2; }
.fx.touch { transform: scale(.975); }
.ripple {
  position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75);
  background: radial-gradient(circle, rgba(255,255,255,.3), transparent 70%);
  pointer-events: none; z-index: 1;
  animation: rip .75s ease-out forwards;
}
@keyframes rip { from { transform: scale(0); opacity: 1; } to { transform: scale(15); opacity: 0; } }

/* Halaman pembayaran */
.pay h2 { font-size: 19px; margin-bottom: 6px; }
.pay p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
.qr { max-width: 300px; margin: 0 auto 14px; }
.qr .poster { width: 100%; }
.qr .poster img { max-height: none; width: 100%; }
.steps { list-style: none; counter-reset: s; display: grid; gap: 9px; margin-bottom: 14px; }
.steps li { counter-increment: s; display: flex; gap: 11px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.steps li::before {
  content: counter(s); flex-shrink: 0;
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,.9); color: #1a1440;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* Kartu testimoni di halaman QR */
.testi { margin-top: 14px; border-radius: 20px; padding: 16px; }
.testi h3 { font-size: 16px; }
.testi small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.testi .btn { margin-top: 10px; }
.prevgrid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  margin: 12px 0 0;
  cursor: pointer;
}
.prevgrid img {
  width: 100%; aspect-ratio: 9 / 16;
  object-fit: contain;
  border-radius: 10px;
  display: block;
  background: #0d0a1c;
  border: 1px solid rgba(255,255,255,.18);
}

.info { margin-top: 14px; border-radius: 20px; padding: 18px 16px; }
.info h3 { text-align: center; font-size: 16px; margin-bottom: 12px; }
.info ul { list-style: none; display: grid; gap: 9px; margin-bottom: 14px; }
.info li { display: flex; gap: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.info li::before {
  content: "✓"; flex-shrink: 0;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(255,255,255,.9); color: #1a1440;
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.guarantee {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 16px;
  border: 1px solid rgba(255,255,255,.4);
  background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.06));
}
.guarantee .g { font-size: 26px; }
.guarantee b { display: block; font-size: 15px; }
.guarantee span { font-size: 13px; line-height: 1.5; }
.foot { text-align: center; font-size: 12px; color: #77749a; margin-top: 18px; line-height: 1.7; }

/* Dock lensa */
.dock {
  position: fixed;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 30;
  width: min(95vw, 420px);
  padding: 5px;
  border-radius: 999px;
  display: flex;
  touch-action: pan-y;
  user-select: none; -webkit-user-select: none;
}
.lens {
  position: absolute; top: 5px; bottom: 5px; left: 5px;
  width: calc((100% - 10px) / var(--n));
  border-radius: 999px;
  background:
    radial-gradient(120% 140% at 30% 0%, rgba(255,255,255,.7), rgba(255,255,255,.14) 60%),
    rgba(255,255,255,.1);
  box-shadow: inset 0 1px 0 #fff, inset 0 -2px 6px rgba(255,255,255,.25), 0 3px 14px rgba(255,255,255,.2);
  transform: translateX(calc(var(--k) * 100%));
  transition: scale .35s cubic-bezier(.34,1.6,.5,1);
  pointer-events: none;
}
.dock.moving .lens { scale: 1.12 1.08; }
.dock button {
  position: relative; z-index: 1; flex: 1;
  min-width: 0;
  padding: 7px 0 6px;
  border: 0; background: none;
  color: var(--muted);
  font-size: 10px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transition: color .2s;
}
.dock button.on { color: #fff; }

/* Ikon logo di dock */
.ico {
  display: block;
  width: 24px; height: 24px;
  border-radius: 7px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
  pointer-events: none;
}

.dock button:focus-visible, .buy:focus-visible, .btn:focus-visible, .poster:focus-visible, .snd:focus-visible, .proof:focus-visible, .t:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

/* Galeri testimoni */
#gal {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(5,3,13,.96);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: calc(76px + env(safe-area-inset-top, 0px)) 12px calc(26px + env(safe-area-inset-bottom, 0px));
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
#gal.open { opacity: 1; pointer-events: auto; }
.gal-top {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 460px;
  z-index: 91;
  padding: 10px 12px 10px 16px;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.gal-top b { display: block; font-size: 15px; }
.gal-top small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
#gal-wa { max-width: 460px; margin: 0 auto 12px; }
/* Screenshot panjang tampil utuh, 2 kolom */
.gal-grid {
  max-width: 460px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
}
#gal-more { max-width: 460px; margin: 14px auto 0; }
.t {
  padding: 0; border: 0;
  border-radius: 12px;
  overflow: hidden;
  background: #0d0a1c;
  aspect-ratio: 9 / 16;
  cursor: zoom-in;
  box-shadow: 0 0 0 1px rgba(255,255,255,.16);
}
.t img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* Lightbox */
#lightbox {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.93);
  display: flex; align-items: center; justify-content: center;
  padding: 12px;
  opacity: 0; pointer-events: none; transition: opacity .2s; cursor: zoom-out;
  touch-action: none;
}
#lightbox.open { opacity: 1; pointer-events: auto; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
#lightbox .x {
  position: absolute; top: 14px; right: 14px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.15); color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 26px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 2;
}
.lb-nav.prev { left: 10px; }
.lb-nav.next { right: 10px; }
.lb-cnt {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 5px 12px; border-radius: 999px;
  background: rgba(255,255,255,.14);
  font-size: 12px; font-weight: 700;
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<body>
<div class="bg"></div>

<header class="top glass blur">
  <img src="logo.jpg" alt="Logo UAN Digital Store">
  <div class="ttl">
    <b>UAN Digital Store</b>
  </div>
  <div class="promo" aria-label="Diskon besar, semua jadi harga 5 ribu">
    <span class="fire"><span>🔥</span></span>
    <div><small>DISKON BESAR</small><b>SEMUA JADI<br>HARGA 5K</b></div>
  </div>
  <button type="button" id="snd" class="snd" aria-label="Suara on/off">🔊</button>
</header>

<main class="pager" id="pager"></main>

<nav class="dock glass blur" id="dock" aria-label="Navigasi halaman">
  <div class="lens" aria-hidden="true"></div>
</nav>

<!-- Galeri testimoni -->
<div id="gal" role="dialog" aria-modal="true" aria-label="Testimoni pembeli">
  <div class="gal-top glass blur">
    <div><b>Testimoni Pembeli</b><small id="gal-sub">Ketuk foto untuk memperbesar</small></div>
    <button type="button" id="gal-x" class="snd" aria-label="Tutup galeri">✕</button>
  </div>
  <a id="gal-wa" class="btn wa fx" href="https://whatsapp.com/channel/0029Vb8pe7i7dmebUJEHwM40" target="_blank" rel="noopener noreferrer">💬 Lihat lebih banyak di Saluran WA Testimoni</a>
  <div class="gal-grid" id="gal-grid"></div>
  <button type="button" id="gal-more" class="btn fx" hidden>Muat lebih banyak</button>
</div>

<div id="lightbox" role="dialog" aria-label="Gambar diperbesar">
  <div class="x">✕</div>
  <div class="lb-cnt" id="lb-cnt" hidden></div>
  <button type="button" class="lb-nav prev" id="lb-prev" aria-label="Sebelumnya" hidden>‹</button>
  <button type="button" class="lb-nav next" id="lb-next" aria-label="Berikutnya" hidden>›</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const nomorAdmin = "6285136446443";
const SALURAN_TESTI = "https://whatsapp.com/channel/0029Vb8pe7i7dmebUJEHwM40";

/* Testimoni: file berawalan "testi" lalu nomor (testi1.jpg, testi25.jpg, "testi 76.jpg" juga terbaca).
   Daftar foto dibaca langsung dari repo GitHub, jadi nomor boleh bolong dan ekstensi bebas
   (jpg, jpeg, png, webp). Nomor terbesar (paling baru) tampil paling depan. */
const T = { prefix: "testi", max: 999999, ext: "jpg" };
const namaFile = {};   /* nomor -> nama file asli di repo */
const tSrc = i => namaFile[i] ? encodeURIComponent(namaFile[i]) : `${T.prefix}${i}.${T.ext}`;
const tLabel = n => n.toLocaleString("id-ID");   /* jumlah persis, bukan dibulatkan */

/* Foto kecil diperkecil otomatis lewat wsrv.nl (file asli tidak diubah, jadi cadangan kalau gagal) */
const CDN = /^https?:$/.test(location.protocol) && !/localhost|127\.0\.0\.1/.test(location.hostname);
const abs = f => new URL(f, location.href).href;
const lewat = (f, w, q) => `https://wsrv.nl/?url=${encodeURIComponent(abs(f))}&w=${w}&q=${q}&we&output=webp`;
const kecil = n => CDN ? lewat(tSrc(n), 360, 70) : tSrc(n);
const besar = n => CDN ? lewat(tSrc(n), 1080, 85) : tSrc(n);

/* Cek ada/tidaknya file (dipakai hanya untuk cadangan) */
function adaImg(i) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = tSrc(i);
  });
}
async function ada(i) {
  try {
    const r = await fetch(tSrc(i), { method: "HEAD", cache: "no-store" });
    if (!r.ok) return false;
    const ct = r.headers.get("content-type") || "";
    return ct.indexOf("image") === 0;
  } catch (e) {
    return adaImg(i);
  }
}

/* Utama: baca daftar file dari repo GitHub */
const GH = { user: "uanhoerulanam", repo: "jual-akun-premium", branch: "main" };

async function dariGitHub() {
  const r = await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/?ref=${GH.branch}`);
  if (!r.ok) throw new Error("github " + r.status);
  const files = await r.json();
  if (!Array.isArray(files)) throw new Error("github format");
  const pola = new RegExp("^" + T.prefix + "[\\s_-]*(\\d+)\\.(jpe?g|png|webp)$", "i");
  const nomor = [];
  files.forEach(f => {
    const m = pola.exec(f.name);
    if (m) { const n = +m[1]; namaFile[n] = f.name; nomor.push(n); }
  });
  if (!nomor.length) throw new Error("kosong");
  return nomor;
}

/* Cadangan kalau GitHub tidak bisa diakses: pindai per 40 nomor (jeda kosong sampai 200 nomor) */
const CH = 40, GAP = 200;
async function pindai() {
  const nomor = [];
  let kosong = 0;
  for (let mulai = 1; mulai <= T.max; mulai += CH) {
    const akhir = Math.min(mulai + CH - 1, T.max);
    const cek = [];
    for (let i = mulai; i <= akhir; i++) cek.push(ada(i).then(ok => (ok ? i : 0)));
    const hasil = (await Promise.all(cek)).filter(Boolean);
    if (hasil.length) { nomor.push(...hasil); kosong = 0; }
    else { kosong += CH; if (kosong >= GAP) break; }
  }
  return nomor;
}

async function cariTesti() {
  try {
    const c = JSON.parse(localStorage.getItem("testi_cache2") || "null");
    if (c && c.d && c.d.length && Date.now() - c.t < 2 * 60 * 1000) {
      Object.assign(namaFile, c.f || {});
      return c.d;
    }
  } catch (e) {}

  let nomor;
  try { nomor = await dariGitHub(); } catch (e) { nomor = await pindai(); }
  nomor = [...new Set(nomor)].sort((a, b) => b - a);   /* terbaru (nomor terbesar) duluan */

  if (nomor.length) {
    try { localStorage.setItem("testi_cache2", JSON.stringify({ t: Date.now(), d: nomor, f: namaFile })); } catch (e) {}
  }
  return nomor;
}

/* Suara geser */
let audioCtx = null, soundOn = true, lastIdx = 0, lastTick = 0;
try { soundOn = localStorage.getItem("uan_sound") !== "off"; } catch (e) {}

function unlockAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
}
["pointerdown", "touchstart", "keydown"].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { passive: true })
);

function playTick() {
  if (!soundOn || !audioCtx || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;
  if (now - lastTick < 0.06) return;
  lastTick = now;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(420, now);
  o.frequency.exponentialRampToValueAtTime(980, now + 0.09);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.14, now + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
  o.connect(g).connect(audioCtx.destination);
  o.start(now);
  o.stop(now + 0.2);

  if (navigator.vibrate) navigator.vibrate(8);
}

/* Lensa mengikuti geseran halaman */
let dragging = false, moveTimer, ticking = false;

function setK(k) {
  dock.style.setProperty("--k", k);
  const n = Math.round(k);
  btns.forEach((b, i) => b.classList.toggle("on", i === n));
  if (n !== lastIdx) { lastIdx = n; playTick(); }
}
function goTo(i) {
  pager.scrollTo({ left: i * pager.clientWidth, behavior: "smooth" });
}

pager.addEventListener("scroll", () => {
  dock.classList.add("moving");
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => dock.classList.remove("moving"), 160);
  if (dragging || ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    setK(Math.max(0, Math.min(N - 1, pager.scrollLeft / pager.clientWidth)));
  });
}, { passive: true });

/* Ketuk atau geser lensa */
function posToK(e) {
  const r = dock.getBoundingClientRect();
  const w = (r.width - 10) / N;
  return Math.max(0, Math.min(N - 1, (e.clientX - r.left - 5) / w - 0.5));
}
dock.addEventListener("pointerdown", e => {
  dragging = true;
  dock.classList.add("moving");
  dock.setPointerCapture(e.pointerId);
  setK(posToK(e));
});
dock.addEventListener("pointermove", e => { if (dragging) setK(posToK(e)); });
dock.addEventListener("pointerup", e => {
  if (!dragging) return;
  dragging = false;
  dock.classList.remove("moving");
  const i = Math.round(posToK(e));
  setK(i);
  goTo(i);
});
dock.addEventListener("pointercancel", () => { dragging = false; dock.classList.remove("moving"); });
window.addEventListener("resize", () => setK(pager.scrollLeft / pager.clientWidth));

/* Galeri testimoni (dimuat bertahap) + lightbox */
const BATCH = 48;
const gal = document.getElementById("gal");
const galGrid = document.getElementById("gal-grid");
const galMore = document.getElementById("gal-more");
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lightbox-img");
const lbPrev = document.getElementById("lb-prev");
const lbNext = document.getElementById("lb-next");
const lbCnt = document.getElementById("lb-cnt");

let built = 0, galBuilt = false, io = null;
let curIdx = 0;          /* 0 = zoom biasa (poster/QR), >0 = urutan foto testimoni (1 = terbaru) */
let swiped = false, sx = null;

function tambahBatch() {
  const end = Math.min(built + BATCH, jumlah);
  const frag = document.createDocumentFragment();
  for (let pos = built + 1; pos <= end; pos++) {
    const num = no(pos);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "t";
    b.dataset.i = pos;
    b.setAttribute("aria-label", "Testimoni " + pos);
    const img = new Image();
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = "Testimoni pembeli " + pos;
    let coba = 0;
    img.onerror = () => { if (coba++ === 0 && CDN) img.src = tSrc(num); else b.hidden = true; };
    img.src = kecil(num);
    b.appendChild(img);
    frag.appendChild(b);
  }
  galGrid.appendChild(frag);
  built = end;
  galMore.hidden = built >= jumlah;
  if (io) {
    if (built >= jumlah) io.disconnect();
    else { io.unobserve(galMore); io.observe(galMore); }
  }
}

function bukaGal() {
  siap.then(n => {
    if (!n) return;
    if (!galBuilt) {
      galBuilt = true;
      tambahBatch();
      if ("IntersectionObserver" in window) {
        io = new IntersectionObserver(es => {
          if (es.some(x => x.isIntersecting) && built < jumlah) tambahBatch();
        }, { root: gal, rootMargin: "600px" });
        if (built < jumlah) io.observe(galMore);
      }
    }
    gal.classList.add("open");
  });
}
function tutupGal() { gal.classList.remove("open"); }

function updCnt() { lbCnt.textContent = curIdx + " / " + jumlah; }
function tampilBesar() {
  const num = no(curIdx);
  let coba = 0;
  lbImg.onerror = () => { if (coba++ === 0 && CDN) lbImg.src = tSrc(num); };
  lbImg.src = besar(num);
}
function bukaLB(src, idx) {
  curIdx = idx || 0;
  const foto = curIdx > 0;
  if (foto) tampilBesar(); else { lbImg.onerror = null; lbImg.src = src; }
  lbCnt.hidden = !foto;
  lbPrev.hidden = lbNext.hidden = !(foto && jumlah > 1);
  if (foto) updCnt();
  lb.classList.add("open");
}
function tutupLB() { lb.classList.remove("open"); curIdx = 0; }
function geser(dir) {
  if (!curIdx || jumlah < 2) return;
  curIdx = ((curIdx - 1 + dir + jumlah) % jumlah) + 1;
  tampilBesar();
  updCnt();
}

/* Geser jari di lightbox untuk pindah foto */
document.addEventListener("pointerdown", () => { swiped = false; }, true);
lb.addEventListener("pointerdown", e => { sx = e.clientX; });
lb.addEventListener("pointerup", e => {
  if (sx === null) return;
  const dx = e.clientX - sx;
  sx = null;
  if (curIdx && Math.abs(dx) > 50) { swiped = true; geser(dx < 0 ? 1 : -1); }
});

document.addEventListener("click", e => {
  if (swiped) { swiped = false; return; }

  if (e.target.closest("#lb-prev")) { geser(-1); return; }
  if (e.target.closest("#lb-next")) { geser(1); return; }
  if (e.target.closest("#gal-x")) { tutupGal(); return; }
  if (e.target.closest("#gal-more")) { tambahBatch(); return; }
  if (e.target.closest("#lightbox")) { tutupLB(); return; }

  const t = e.target.closest(".t");
  if (t) { bukaLB(null, +t.dataset.i); return; }

  if (e.target.closest("[data-gal]")) { bukaGal(); return; }

  const z = e.target.closest("[data-zoom]");
  if (z) { bukaLB(z.dataset.zoom, 0); }
});

/* Keyboard */
document.addEventListener("keydown", e => {
  if (lb.classList.contains("open")) {
    if (e.key === "Escape") tutupLB();
    else if (curIdx && e.key === "ArrowRight") geser(1);
    else if (curIdx && e.key === "ArrowLeft") geser(-1);
    return;
  }
  if (gal.classList.contains("open")) {
    if (e.key === "Escape") tutupGal();
    return;
  }
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  if (e.key === "ArrowRight" && i < N - 1) goTo(i + 1);
  if (e.key === "ArrowLeft" && i > 0) goTo(i - 1);
});

setK(0);
